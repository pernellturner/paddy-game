<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1226">
<link rel="icon" href="assets/s1_05.png">
<title>Paddy — boxing test</title>
<style>
@font-face{font-family:'Bangers';src:url(fonts/Bangers.woff2) format('woff2');font-display:swap}
html,body{margin:0;height:100%;background:#0d1226;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;background:#0d1226}
#ui{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
#move{background:#0008;color:#ffe14d;border-radius:10px;padding:6px 10px;font:20px Bangers,Impact,sans-serif;letter-spacing:.4px;text-shadow:0 1px 0 #000}
#tag{background:#0008;color:#fff;border-radius:10px;padding:6px 10px;font:600 13px system-ui;line-height:1.25;text-align:right}
#tag b{color:#ffe14d;font-weight:700}
#pad{position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.b{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.38);color:#fff;font:bold 22px system-ui;text-shadow:0 1px 2px #0008;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:0}
.b.on{background:rgba(255,255,255,.75);color:#246}
#punch{width:86px;height:86px;font:700 15px system-ui;background:rgba(255,200,70,.55)}
#punch.on,#punch.charge{background:rgba(255,210,60,.92);color:#3a2400}
#dpad{position:relative;width:196px;height:132px}
#dpad .b{position:absolute}
#up{left:66px;top:0}
#left{left:0;top:64px}
#down{left:66px;top:64px}
#right{left:132px;top:64px}
#hint{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(46px,calc(env(safe-area-inset-top) + 40px));color:#fff9;font:12px system-ui;text-shadow:0 1px 2px #000;max-width:70%}
@media (pointer:coarse){#hint{display:none}}
@media (max-height:430px){
  .b{width:52px;height:52px;font-size:18px}
  #punch{width:68px;height:68px;font-size:13px}
  #dpad{width:164px;height:108px}
  #up{left:56px;top:0}
  #left{left:0;top:52px}
  #down{left:56px;top:52px}
  #right{left:112px;top:52px}
  #hint{display:none}
  #move{font-size:16px}
  #tag{font-size:11px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div id="move">GUARD</div>
    <div id="tag">Test copy<br><b id="hits">HITS 0</b></div>
  </div>
  <div id="hint">Hold ◀ ▶ to run · double-tap a direction · X or J punch · hold punch to charge</div>
  <div id="pad">
    <div id="dpad">
      <button class="b" id="up" type="button" aria-label="Up">▲</button>
      <button class="b" id="left" type="button" aria-label="Left">◀</button>
      <button class="b" id="down" type="button" aria-label="Down">▼</button>
      <button class="b" id="right" type="button" aria-label="Right">▶</button>
    </div>
    <button class="b" id="punch" type="button" aria-label="Punch">Punch</button>
  </div>
</div>
<script src="test-straight.js"></script>
</body>
</html>
